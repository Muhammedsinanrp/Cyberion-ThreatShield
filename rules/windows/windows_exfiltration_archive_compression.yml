title: Data Staging and Compression for Exfiltration
id: 8278fcdd-77c5-4a40-9e5f-a113b4719f64
status: experimental
description: Detects the execution of command-line archiving utilities used to compress sensitive files prior to exfiltration.
references:
  - https://attack.mitre.org/techniques/T1560/
author: Cyberion Defense Labs
date: 2026/03/18
tags:
  - attack.t1560
  - attack.exfiltration
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - ' -a '
      - ' a '
      - 'tar -cf'
      - 'Compress-Archive'
      - 'Get-CimInstance'
  condition: selection
falsepositives:
  - Legitimate backups, log collection, or software archiving routines.
level: medium
