title: Remote Desktop Connection History Cleared
id: cd-rule-006
status: experimental
description: Detects deletion or clearing of RDP client history (Default.rdp or registry MRU keys) to cover tracks.
references:
  - https://attack.mitre.org/techniques/T1070/
author: Cyberion Defense Labs
date: 2026/03/18
tags:
  - attack.t1070
  - attack.defense_evasion
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 11
    TargetFilename|contains:
      - \Default.rdp
      - \Terminal Server Client\Default
  condition: selection
falsepositives:
  - User resetting saved RDP preferences or cleanup utilities.
level: medium
