title: Windows Defender Tampering and Disable Attempt
id: cd75aeed-43e8-41d8-b1fc-659d536b55da
status: experimental
description: Detects command-line execution attempting to disable Windows Defender real-time protection or tamper with security settings.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: Cyberion Defense Labs
date: 2026/03/18
tags:
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Set-MpPreference'
      - 'DisableRealtimeMonitoring'
      - 'DisableIOAVProtection'
      - 'DisableBehaviorMonitoring'
  condition: selection
falsepositives:
  - Authorized administrative scripts or deployment tools managing enterprise security policies.
level: high
