title: Credential Dumping via LSASS Handle Access
id: cd-rule-008
status: experimental
description: Detects processes requesting handle access to lsass.exe with high privileges, often associated with credential dumping tools like Mimikatz.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Cyberion Defense Labs
date: 2026/03/18
tags:
  - attack.t1003.001
  - attack.credential_access
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 10
    TargetImage|endswith: \lsass.exe
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x1F3FFF'
  condition: selection
falsepositives:
  - Legitimate administrative diagnostics, antivirus, or endpoint detection tools inspecting LSASS.
level: critical
