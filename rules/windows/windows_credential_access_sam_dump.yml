title: Security Account Manager (SAM) Hive Access or Copy
id: 22a07a3b-1b7b-4222-ae5a-3ddbda4071f5
status: experimental
description: Detects direct access, export, or copying of the SAM registry hive files used for credential extraction.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: Cyberion Defense Labs
date: 2026/03/18
tags:
  - attack.t1003.002
  - attack.credential-access
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
      - \SAM
      - \SYSTEM
      - \SECURITY
  condition: selection
falsepositives:
  - Legitimate offline backup software or Volume Shadow Copy operations.
level: high
