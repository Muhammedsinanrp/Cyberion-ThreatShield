title: Correlation - Reconnaissance to PsExec Lateral Movement
id: cd-corr-001
status: experimental
description: Correlates user/system discovery reconnaissance followed within a short time window by PsExec remote service installation.
author: Cyberion Defense Labs
date: 2026/03/18
type: temporal
rules:
  - windows_discovery_whoami_net
  - windows_lateral_movement_psexec
group-by:
  - ComputerName
timespan: 15m
condition: windows_discovery_whoami_net -> windows_lateral_movement_psexec
falsepositives:
  - Authorized administrative maintenance scripts performing rapid checks and remote deployments.
level: high
