title: LSASS Memory Handle Access Followed by Outbound Network Connection
id: a8204917-8e12-4b33-9112-98471203a111
status: production
description: |
  Detects an attacker workflow where a suspicious memory handle request to lsass.exe (Sysmon Event ID 10 with
  GrantedAccess 0x1010 or 0x1F0FFF) is followed within 10 minutes by an outbound network connection (Sysmon Event ID 3
  or Zeek conn.log) from the same host, indicating credential extraction and exfiltration or C2 callback.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1071/001/
author: Cyberion Defense Labs — Detection Engineering Practice
date: 2026-10-15
modified: 2026-11-10
tags:
  - attack.credential_access
  - attack.command_and_control
  - attack.t1003.001
  - attack.t1071.001
logsource:
  product: windows
correlation:
  type: temporal
  rules:
    - lsass_access
    - network_outbound
  group-by:
    - Computer
  timespan: 10m
detection:
  lsass_access:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1F0FFF'
      - '0x1410'
  network_outbound:
    EventID: 3
    Initiated: true
    DestinationPort:
      - 80
      - 443
      - 8080
      - 8443
  condition: lsass_access followed_by network_outbound by Computer within 10m
falsepositives:
  - Endpoint security agents (EDR/XDR) scanning LSASS memory and uploading telemetry to vendor cloud consoles.
level: critical
