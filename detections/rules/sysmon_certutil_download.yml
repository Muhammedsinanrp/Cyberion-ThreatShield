title: Ingress Tool Transfer Via Certutil URLCache Flag
id: 5b2e1e0a-42c2-4a0b-8d5c-9c7ef2b6e111
status: production
description: |
  Detects the execution of certutil.exe with flags commonly used to download remote files from the internet,
  including '-urlcache', '-split', and '-f'. Adversaries leverage certutil.exe as a Living-off-the-Land Binary (LOLBAS)
  to bypass perimeter egress inspection and stage secondary payloads.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Cyberion Defense Labs — Detection Engineering Practice
date: 2026-10-15
modified: 2026-11-10
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_flags_urlcache:
    CommandLine|contains:
      - '-urlcache'
      - '/urlcache'
  selection_flags_split:
    CommandLine|contains:
      - '-split'
      - '/split'
      - '-f'
      - '/f'
  condition: selection_img and selection_flags_urlcache and selection_flags_split
falsepositives:
  - Legitimate enterprise certificate verification scripts updating CRLs from internal PKI servers.
  - Software deployment tools verifying code signing certificates against Microsoft public endpoints.
level: high
