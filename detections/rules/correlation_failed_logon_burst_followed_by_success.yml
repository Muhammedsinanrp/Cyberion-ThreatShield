title: Correlation - Brute Force Failed Logon Burst Followed by Success
id: cd-corr-002
status: experimental
description: Detects a high volume of failed logon attempts from a single source followed by a successful logon, indicating potential brute force success.
author: Cyberion Defense Labs
date: 2026/03/18
type: value count
rules:
  - windows_failed_logon
  - windows_successful_logon
group-by:
  - TargetUserName
  - SourceIpAddress
timespan: 10m
condition: windows_failed_logon > 5 and windows_successful_logon == 1
falsepositives:
  - Users mistyping passwords multiple times before successfully authenticating.
level: high
