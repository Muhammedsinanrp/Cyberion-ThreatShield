title: Suspicious Windows Service Installation - Security 4697
id: 82b45100-36a8-4e1b-8519-75a892b1e555
status: experimental
description: Detects suspicious Windows service installations through Security Event ID 4697.
author: Cyberion Defense Labs
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1021/002/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.lateral_movement
  - attack.t1543.003
  - attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID: 4697
  selection_suspicious_paths:
    ServiceFileName|contains:
      - '\AppData\'
      - '\Users\Public\'
      - '\Temp\'
      - '\Windows\Temp\'
      - 'ADMIN$'
      - 'C$\'
  selection_known_tools:
    ServiceName|contains:
      - 'PSEXESVC'
      - 'winexe'
      - 'PAExec'
    ServiceFileName|contains:
      - 'PSEXESVC.exe'
      - 'PAExec.exe'
  condition: selection_event and (selection_suspicious_paths or selection_known_tools)
falsepositives:
  - Authorized administrative use of PsExec or other remote management tools.
  - Legitimate software installers using temporary service paths.
level: high
