title: Correlation - Credential Dumping Followed by C2 Beaconing
id: cd-corr-003
status: experimental
description: Correlates LSASS credential dumping activity on a host followed shortly by outbound C2 beaconing signatures.
author: Cyberion Defense Labs
date: 2026/03/18
type: temporal
rules:
  - windows_credential_dumping_lsass.io
  - windows_c2_beaconing_dns_requests
group-by:
  - ComputerName
timespan: 30m
condition: windows_credential_dumping_lsass.io -> windows_c2_beaconing_dns_requests
falsepositives:
  - Administrative security auditing or authorized penetration testing.
level: critical
